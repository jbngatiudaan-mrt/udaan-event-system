<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Gate scanner · Udaan</title>
<meta name="theme-color" content="#0E1840">
<meta name="robots" content="noindex">
<link rel="manifest" href="/gate.webmanifest">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/gate.css">
</head>
<body>

<section id="login" class="login" hidden>
  <img src="/img/udaan.alpha.png" alt="Udaan" class="login-logo">
  <h1>Gate scanner</h1>
  <form id="login-form" class="login-card">
    <div class="field">
      <label for="gate-name">Which gate are you at?</label>
      <select id="gate-name" required>
        <option>Gate 1</option><option>Gate 2</option><option>Gate 3</option><option>Gate 4</option><option>Gate 5</option><option>Help desk</option>
      </select>
    </div>
    <div class="field">
      <label for="pin">Volunteer PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" required>
    </div>
    <p class="err" id="login-err" role="alert"></p>
    <button class="btn" type="submit">Start scanning</button>
  </form>
  <footer class="credits on-dark" aria-label="Credits"></footer>
</section>

<section id="app" class="app" hidden>
  <header class="bar">
    <div class="who"><strong id="who">Gate</strong><span id="net" class="net on">Online</span></div>
    <div class="count"><strong id="count">0</strong><span>checked in</span></div>
    <button id="mute" class="icon-btn" type="button" aria-pressed="false" title="Sound on">🔊</button>
  </header>

  <div class="viewfinder">
    <div id="reader"></div>
    <div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <button id="cam-start" class="btn cam-start" type="button" hidden>Turn on camera</button>
    <p id="cam-msg" class="cam-msg" hidden></p>
  </div>

  <form id="manual" class="manual">
    <label for="code" class="sr-only">Ticket code</label>
    <input id="code" placeholder="Type ticket code, e.g. UDN-7K4P9Q" autocapitalize="characters" autocomplete="off" spellcheck="false">
    <button class="btn navy" type="submit">Check in</button>
  </form>

  <div class="recent">
    <div class="recent-head"><h2>Recent at this gate</h2><span id="pending" class="pending" hidden></span></div>
    <ol id="log"></ol>
  </div>
</section>

<div id="result" class="result" hidden role="alertdialog" aria-live="assertive">
  <div class="result-inner">
    <div class="glyph" id="r-glyph" aria-hidden="true"></div>
    <p class="r-title" id="r-title"></p>
    <p class="r-name" id="r-name"></p>
    <p class="r-sub" id="r-sub"></p>
    <p class="r-tap">Tap anywhere to scan the next pass</p>
  </div>
</div>

<script src="/vendor/jsQR.js"></script>
<script src="/js/qrscan.js"></script>
<script src="/vendor/gsap.min.js"></script>
<script src="/js/sounds.js"></script>
<script src="/js/gate.js"></script>
<script src="/js/credits.js" defer></script>
<script src="/js/env.js" defer></script>
</body>
</html>
