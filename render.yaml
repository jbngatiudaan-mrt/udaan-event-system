# Optional: Render Blueprint (Dashboard -> New -> Blueprint). The runbook uses the manual "New Web Service" path instead.
services:
  - type: web
    name: udaan-uat
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_ENV
        value: uat
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: GATE_PIN
        sync: false
      - key: STAGE_PIN
        sync: false
      - key: WA_TOKEN
        sync: false
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_WABA_ID
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: WA_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WA_BUSINESS_NUMBER
        sync: false
      - key: WA_MODE
        value: template
      - key: POWERED_BY_WHATSAPP
        sync: false
